spring:
  application:
    name: bap-otomasyon

  datasource:
    url: jdbc:postgresql://localhost:5432/bap_otomasyon
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: smtp.mersin.edu.tr
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

bap:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1pbi1wcm9kdWN0aW9uLW5vdy1taW4tMzItYnl0ZXMh}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}
    mail-from: ${MAIL_FROM:noreply@mersin.edu.tr}

server:
  port: 8080
